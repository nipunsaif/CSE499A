<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DhakaDrive Knowledge Graph</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        margin: 0;

        /* Relative path for the background image */
        background-image: url("back2.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .kg-wrapper {
        width: 100%;
        height: 80vh;
        min-height: 500px;
        border: 2px solid #000000;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        /* Solid background here so the graph stays visible over your new image */
        background-color: #ffffff;
      }

      .kg-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      h2 {
        color: #ffffff; /* Changed header color to white */
        /* Added a dark shadow to make the white text pop against the background */
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      }

      p {
        color: #ffffff; /* Changed paragraph color to white for consistency */
        font-weight: bold;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <h2>Pedestrian Feature Rules (DhakaDrive)</h2>
    <p>Interact with the graph below to explore nodes, edges, and rules.</p>

    <div class="kg-wrapper">
      <iframe
        class="kg-iframe"
        src="responsive_kg.html"
        title="Knowledge Graph Visualization"
      ></iframe>
    </div>
  </body>
</html>
